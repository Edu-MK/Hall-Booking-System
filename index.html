function parseCSV(text) {
  var lines = text.split('\n');
  if (lines.length < 2) return [];
  var headerLine = lines[0]; var headers = []; var inQuote = false; var field = '';
  for (var ci = 0; ci < headerLine.length; ci++) {
    var ch = headerLine[ci];
    if (ch === '"') { inQuote = !inQuote; }
    else if (ch === ',' && !inQuote) { headers.push(field.trim()); field = ''; }
    else { field += ch; }
  }
  headers.push(field.trim());
  var results = [];
  for (var li = 1; li < lines.length; li++) {
    var line = lines[li]; if (!line.trim()) continue;
    var fields = []; inQuote = false; field = '';
    for (var ci2 = 0; ci2 < line.length; ci2++) {
      var ch2 = line[ci2];
      if (ch2 === '"') { if (inQuote && ci2 + 1 < line.length && line[ci2 + 1] === '"') { field += '"'; ci2++; } else { inQuote = !inQuote; } }
      else if (ch2 === ',' && !inQuote) { fields.push(field); field = ''; }
      else { field += ch2; }
    }
    fields.push(field);
    var obj = {};
    for (var fi = 0; fi < headers.length; fi++) { obj[headers[fi]] = fi < fields.length ? fields[fi].trim() : ''; }
    results.push(obj);
  }
  return results;
}

function buildSheetURL(gid) { return SHEET_BASE_URL + '?gid=' + gid + '&single=true&output=csv'; }

function fetchSheetData() {
  _sheetConnectionStatus.loading = true;
  var keys = Object.keys(SHEET_GIDS);
  var promises = keys.map(function(key) {
    return fetch(buildSheetURL(SHEET_GIDS[key])).then(function(res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.text(); }).then(function(text) { return { key: key, data: parseCSV(text) }; });
  });
  return Promise.all(promises).then(function(results) {
    var out = {}; results.forEach(function(r) { out[r.key] = r.data; });
    _sheetConnectionStatus.connected = true;
    _sheetConnectionStatus.lastUpdate = new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
    _sheetConnectionStatus.loading = false; return out;
  }).catch(function(err) { _sheetConnectionStatus.connected = false; _sheetConnectionStatus.loading = false; console.error('Sheet fetch error:', err); throw err; });
}

function mapRoomsToHalls(rooms) {
  return rooms.filter(function(r) { return r.Room_ID && r.Room_Name; }).map(function(r) {
    var name = r.Room_Name || ''; var floorGuess = 'الدور الأول';
    if (name.indexOf('الثاني') !== -1 || name.indexOf('ثاني') !== -1 || name.indexOf('Second') !== -1) floorGuess = 'الدور الثاني';
    if (name.indexOf('الثالث') !== -1 || name.indexOf('ثالث') !== -1) floorGuess = 'الدور الثالث';
    return { id: r.Room_ID, name: r.Room_Name, building: 'المبنى الرئيسي', floor: floorGuess, capacity: parseInt(r.Capacity) || 30, equipment: [], available: (r.Status || '').toLowerCase() === 'active' || (r.Status || '') === 'متاحة' || (r.Status || '') === '' };
  });
}
function mapPriorityNum(p) { var n = parseInt(p); if (n === 1) return 'عاجلة'; if (n === 2) return 'عالية'; if (n === 3) return 'متوسطة'; if (n === 4) return 'منخفضة'; return p || 'متوسطة'; }
function mapBookings(bookings) {
  return bookings.filter(function(b) { return b.Booking_ID; }).map(function(b) {
    var statusRaw = (b.Status || '').toLowerCase().trim(); var status = 'pending';
    if (statusRaw === 'approved' || statusRaw === 'معتمد') status = 'approved';
    else if (statusRaw === 'pending' || statusRaw === 'معلق') status = 'pending';
    else if (statusRaw === 'rejected' || statusRaw === 'مرفوض') status = 'rejected';

    else if (statusRaw === 'review' || statusRaw === 'قيد المراجعة') status = 'review';

    return { id: b.Booking_ID, title: b.Activity_Name || '', type: b.Activity_Type || 'اجتماع', priority: mapPriorityNum(b.Priority), department: b.Department || '', section: '', organizer: '', requester: b.Requester || '', phone: '', email: '', hallId: b.Room_ID || '', date: b.Date || '', startTime: b.Start_Time || '', endTime: b.End_Time || '', attendees: parseInt(b.Attendees) || 0, equipment: [], hospitality: 'غير مطلوبة', notes: b.Notes || '', status: status, rejectionReason: '', createdAt: b.Created_At || '', updatedBy: '' };

function mapAuditLog(logs) {
  return logs.filter(function(l) { return l.Timestamp; }).map(function(l, idx) {
    var actionRaw = (l.Action || '').trim(); var action = actionRaw;
    if (actionRaw === 'ADD') action = 'إنشاء'; else if (actionRaw === 'UPDATE_STATUS') action = 'تعديل'; else if (actionRaw === 'SETUP') action = 'إعداد'; else if (actionRaw === 'APPROVE') action = 'اعتماد'; else if (actionRaw === 'REJECT') action = 'رفض'; else if (actionRaw === 'CANCEL') action = 'إلغاء';
    var ts = (l.Timestamp || '').replace('T', ' '); if (ts.length > 16) ts = ts.substring(0, 16);
    return { id: idx + 1, timestamp: ts, action: action, bookingId: l.Target_ID || '-', user: l.User || '', role: '', details: l.Details || '', ip: '' };

}
function mapUsers(users) {

        <div className="lg:mr-64">
          <Header title={titles[pg] || 'الرئيسية'} onMenu={function() { setSb(true); }} user={cu} nav={nav} sheetStatus={sheetStatus} onRefreshSheet={refreshFromSheet} onLogout={logout} />
          <main className="p-4 lg:p-6">{renderPg()}</main>
          <LoginModal isOpen={loginOpen} onClose={function(){setLoginOpen(false);}} />
        </div>
      </div>
    </AppCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
